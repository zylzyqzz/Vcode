plugins {
    id 'com.android.application'
}

def releaseKeystore = providers.environmentVariable('VCODE_ANDROID_KEYSTORE').orNull
def releaseStorePassword = providers.environmentVariable('VCODE_ANDROID_STORE_PASSWORD').orNull
def releaseKeyAlias = providers.environmentVariable('VCODE_ANDROID_KEY_ALIAS').orNull
def releaseKeyPassword = providers.environmentVariable('VCODE_ANDROID_KEY_PASSWORD').orNull
def releaseSigningReady = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }
def requestsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

android {
    namespace 'xin.aimj.vcode'
    compileSdk 35

    defaultConfig {
        applicationId 'xin.aimj.vcode'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (requestsRelease && !releaseSigningReady) {
                throw new GradleException('Release signing requires VCODE_ANDROID_KEYSTORE, VCODE_ANDROID_STORE_PASSWORD, VCODE_ANDROID_KEY_ALIAS, and VCODE_ANDROID_KEY_PASSWORD.')
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
