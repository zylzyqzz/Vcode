<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120" role="img" aria-labelledby="title desc">
  <title id="title">Vcode</title>
  <desc id="desc">A golden V mark for Vcode, a terminal coding agent.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.38" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M34 24 L76 91 L118 24" fill="none" stroke="#6b5311" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".45" filter="url(#glow)"/>
  <path d="M34 24 L76 91 L118 24" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="153" y="76" fill="url(#gold)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="42" font-weight="700" letter-spacing="2">vcode</text>
</svg>
