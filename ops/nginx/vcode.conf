limit_req_zone $binary_remote_addr zone=vcode_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=vcode_client:10m;

server {
    listen 80;
    listen [::]:80;
    server_name v.aimj.xin;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/acme/.well-known/acme-challenge/;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v.aimj.xin;

    ssl_certificate /etc/letsencrypt/live/v.aimj.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v.aimj.xin/privkey.pem;
    ssl_session_cache shared:VcodeSSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn vcode_client 20;

    location = /login {
        limit_req zone=vcode_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:18880;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:18880;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
