<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vcode — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b0b0c;
    color: #e8e0ce;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .login-box {
    background: #111113;
    border: 1px solid #6f5420;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 12px 42px rgba(0,0,0,0.42), 0 0 0 1px rgba(200,148,40,0.08);
  }
  .login-box h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
    color: #d4a63a;
  }
  .login-box .subtitle {
    text-align: center;
    font-size: 13px;
    color: #9b927f;
    margin-bottom: 28px;
  }
  .login-box label {
    display: block;
    font-size: 13px;
    color: #b7ad98;
    margin-bottom: 6px;
  }
  .login-box input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #4d4022;
    border-radius: 8px;
    background: #0d0d0f;
    color: #f2ead8;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-box input[type="password"]:focus {
    border-color: #d4a63a;
  }
  .login-box button {
    width: 100%;
    margin-top: 20px;
    padding: 10px 0;
    border: none;
    border-radius: 8px;
    background: #b98a25;
    color: #17130b;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-box button:hover { background: #d4a63a; }
  .login-box input::placeholder { color: #6f685c; }
  .error {
    background: rgba(178, 56, 48, 0.14);
    border: 1px solid #a94b42;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #e58b80;
    margin-bottom: 18px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>Vcode</h1>
  <p class="subtitle">输入访问密码以继续</p>
  <!--ERROR-->
  <form method="post" action="/login">
    <label for="password">访问密码</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password" placeholder="请输入访问密码" required>
    <button type="submit">进入 Vcode</button>
  </form>
</div>
</body>
</html>
