name: CI

on:
  push:
    branches: [master, main-v2]
  pull_request:
    branches: [master, main-v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Skipped on Windows: the runner checks out CRLF, so gofmt -l flags every
      # file. gofmt output is OS-independent, so the Unix legs already cover it.
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
      unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The matrix never runs -race (it needs cgo); the project's concurrency
      # (plugin fan-out, background phase B, jobs Kill/Wait) would otherwise
      # ship without race coverage.
      - name: test -race
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  govulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true # informational — stdlib vulns need a Go patch release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7
